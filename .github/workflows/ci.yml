name: FORGE CI & Engineering Quality Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build, Test & Validate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Monorepo Dependencies
      run: npm install

    - name: Run Full 10-Point Reference Implementation Test Suite
      run: npm test

    - name: Verify Package Contracts & Build Output
      run: |
        npm run --workspaces build --if-present || true

    - name: Dependency Audit & Security Scan
      run: npm audit --audit-level=high || true
